
name: Football Stars 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Find project
        run: |
          mkdir -p extracted
          for f in *.zip; do
            if [ -f "$f" ]; then
              unzip -o "$f" -d extracted
            fi
          done
          find . -name project.godot

      - name: Check project
        run: |
          PROJECT=$(find extracted -name project.godot -print -quit)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Import project
        run: |
          godot --headless --editor \
            --path "$PROJECT_DIR" --import

      - name: Export APK
        run: |
          godot --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            Football-Stars-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Football-Stars-3D-APK
          path: Football-Stars-3D.apk
          if-no-files-found: error
